# .github/workflows/wd5-playwright-poll.yml
# S27b — poll wd5/wd3 via Playwright (Chromium) XHR intercept.
#
# Why Playwright? Workday's listing page is an EMPTY React shell — no job
# hrefs, no data-automation-id in the HTML. But the React app boots and
# fires a CXS POST XHR to /wday/cxs/{tenant}/{slug}/jobs to populate the
# listing. Playwright executes that JavaScript, so we hook page.on('response')
# and read the CXS JSON directly. The browser handles all the CSRF cookies
# transparently — no two-request flow needed.
#
# Chromium is launched through DataImpulse residential proxy so the GET that
# seeds the session originates from a residential IP (wd5 cluster blocks CF
# Worker IPs for GET listings).
#
# Required secrets:
#   DATAIMPULSE_USER  — gw.dataimpulse.com:823 username
#   DATAIMPULSE_PASS  — gw.dataimpulse.com:823 password
#   STAT_INGEST_TOKEN — shared secret matching env.STAT_INGEST_TOKEN on Worker
#
# Constraints enforced by scripts/wd5_playwright_poll.py:
#   - JHBMC must be in the first 3 companies (ground-truth control)
#   - If JHBMC returns 0 jobs across all keywords → log + exit, do NOT ingest
#   - Maintenance redirect (community.workday.com/maintenance-page) → skip tenant
#   - Rate limit: 3s between companies, 2s between keywords, 1s between pages
#
# DO NOT DISPATCH while wd5 cluster is in maintenance — every navigation will
# end at the maintenance redirect; you'll just burn DataImpulse bandwidth.

name: Poll wd5 via Playwright + DataImpulse (S27b)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max companies to poll. Default 3.'
        required: false
        default: '3'
      offset_pages:
        description: 'Per-keyword startIndex pagination cap (20 jobs/page).'
        required: false
        default: '10'
      keywords:
        description: 'Comma-separated keywords. Default: epic,ehr,ambulatory,cadence,cogito,clarity,willow,radiant.'
        required: false
        default: 'epic,ehr,ambulatory,cadence,cogito,clarity,willow,radiant'

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.STAT_PAT }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet 'playwright>=1.40'
          python3 -m playwright install --with-deps chromium

      - name: Verify secrets present
        run: |
          missing=()
          [ -z "${{ secrets.DATAIMPULSE_USER }}" ] && missing+=("DATAIMPULSE_USER")
          [ -z "${{ secrets.DATAIMPULSE_PASS }}" ] && missing+=("DATAIMPULSE_PASS")
          [ -z "${{ secrets.STAT_INGEST_TOKEN }}" ] && missing+=("STAT_INGEST_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"; exit 1
          fi
          echo "OK"

      - name: Run Playwright poll
        env:
          DI_USER:           ${{ secrets.DATAIMPULSE_USER }}
          DI_PASS:           ${{ secrets.DATAIMPULSE_PASS }}
          STAT_INGEST_TOKEN: ${{ secrets.STAT_INGEST_TOKEN }}
          LIMIT:             ${{ github.event.inputs.limit || '3' }}
          MAX_OFFSET_PAGES:  ${{ github.event.inputs.offset_pages || '10' }}
          KEYWORDS:          ${{ github.event.inputs.keywords || 'epic,ehr,ambulatory,cadence,cogito,clarity,willow,radiant' }}
        run: |
          mkdir -p outbox
          python3 scripts/wd5_playwright_poll.py

      - name: Commit results
        run: |
          git config user.email "ci@stat"
          git config user.name "STAT CI"
          git pull --rebase origin main || true
          git add outbox/wd5-playwright-poll-*.json 2>/dev/null || true
          git commit -m "ci: S27b wd5 Playwright poll results [skip ci]" || echo "no changes"
          git push origin main || echo "push skipped"
