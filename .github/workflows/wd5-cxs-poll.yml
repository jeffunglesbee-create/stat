# .github/workflows/wd5-cxs-poll.yml
# S26 production poll — session-cookie CXS flow via DataImpulse residential proxy.
#
# History
#   S24: POST CXS directly → 422 (CSRF cookies required)
#   S25: GET SEO listing page → 500 maintenance redirect (cluster down)
#        Multi-method A/B (cffi vs bot vs browser) confirmed all 3 identical;
#        TLS fingerprinting is NOT the differentiator.
#   S26: Two-request session-cookie flow:
#        1. GET https://{tenant}.wd5.myworkdayjobs.com/en-US/{slug}
#           → captures PLAY_SESSION + CALYPSO_CSRF_TOKEN + __cf_bm cookies.
#        2. POST .../wday/cxs/{tenant}/{slug}/jobs with those cookies
#           → returns CXS JSON {jobPostings: [...], total: N}.
#        Multi-keyword loop reuses cookies (cookies are tenant-scoped, valid for
#        the session). Workflow refuses to sweep all 85 tenants until the
#        session-cookie approach is validated against JHBMC (first slice).
#
# Required secrets:
#   DATAIMPULSE_USER  — gw.dataimpulse.com:823 username
#   DATAIMPULSE_PASS  — gw.dataimpulse.com:823 password
#   STAT_INGEST_TOKEN — shared secret matching env.STAT_INGEST_TOKEN on Worker
#
# Cost (session-cookie flow): 1 GET + 8 CXS POSTs per tenant per cycle.
#   ~10KB GET + 8 × ~5KB POST exchange = ~50KB/tenant.
#   At 85 tenants × 6 cycles/day (every 4h) = 25MB/day = 750MB/month ≈ $0.40/mo.
#
# DO NOT DISPATCH while wd5 cluster is in maintenance — every fetch returns the
# 238-byte maintenance page. Confirm recovery via Worker /plain-fetch-test first.

name: Poll wd5 Workday CXS via session-cookie + proxy (S26)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max companies to poll (test mode). Default 3.'
        required: false
        default: '3'
      offset:
        description: 'Skip first N companies (rotate test set).'
        required: false
        default: '0'
      keywords:
        description: 'Space-separated keywords. Default: epic ehr ambulatory cadence cogito clarity willow radiant.'
        required: false
        default: 'epic ehr ambulatory cadence cogito clarity willow radiant'
      max_offset_pages:
        description: 'Per keyword CXS pagination cap (20 jobs/page).'
        required: false
        default: '10'

permissions:
  contents: write

env:
  WORKER_URL: https://stat-job-watcher.jeffunglesbee.workers.dev

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.STAT_PAT }}

      - name: Install curl_cffi
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet 'curl_cffi>=0.7'

      - name: Verify secrets present
        run: |
          missing=()
          [ -z "${{ secrets.DATAIMPULSE_USER }}" ] && missing+=("DATAIMPULSE_USER")
          [ -z "${{ secrets.DATAIMPULSE_PASS }}" ] && missing+=("DATAIMPULSE_PASS")
          [ -z "${{ secrets.STAT_INGEST_TOKEN }}" ] && missing+=("STAT_INGEST_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"; exit 1
          fi
          echo "OK"

      - name: Session-cookie CXS poll (wd5/wd3 via proxy)
        env:
          DI_USER:      ${{ secrets.DATAIMPULSE_USER }}
          DI_PASS:      ${{ secrets.DATAIMPULSE_PASS }}
          INGEST_TOKEN: ${{ secrets.STAT_INGEST_TOKEN }}
          LIMIT:        ${{ github.event.inputs.limit || '3' }}
          OFFSET:       ${{ github.event.inputs.offset || '0' }}
          KEYWORDS:     ${{ github.event.inputs.keywords || 'epic ehr ambulatory cadence cogito clarity willow radiant' }}
          MAX_PAGES:    ${{ github.event.inputs.max_offset_pages || '10' }}
        run: |
          mkdir -p outbox
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          POLL_LOG="outbox/wd5-poll-${TS}.json"

          POLL_LOG="$POLL_LOG" python3 << 'PYEOF'
          import json, os, sys, time, urllib.request, urllib.error

          try:
              from curl_cffi import requests as cf_requests
          except ImportError as e:
              print(f'::error::curl_cffi import failed: {e}', file=sys.stderr); sys.exit(1)

          DI_USER      = os.environ['DI_USER']
          DI_PASS      = os.environ['DI_PASS']
          PROXY        = f'http://{DI_USER}:{DI_PASS}@gw.dataimpulse.com:823'
          INGEST_TOKEN = os.environ['INGEST_TOKEN']
          WORKER_URL   = os.environ['WORKER_URL']
          LIMIT        = int(os.environ['LIMIT'])
          OFFSET       = int(os.environ['OFFSET'])
          KEYWORDS     = os.environ['KEYWORDS'].split()
          MAX_PAGES    = int(os.environ['MAX_PAGES'])
          POLL_LOG     = os.environ['POLL_LOG']

          # Load inventory
          inv = json.load(open('outbox/wd5-companies.json'))['companies']
          companies = inv[OFFSET : OFFSET + LIMIT]
          print(f'Inventory: {len(inv)} total. Slicing [offset={OFFSET}, limit={LIMIT}]')
          print(f'Keywords ({len(KEYWORDS)}): {KEYWORDS}')

          def seed_session(host, slug, proxy=PROXY):
              """Step 1: GET listing page through proxy, return Response with cookies."""
              listing_url = f'https://{host}/en-US/{slug}'
              return cf_requests.get(
                  listing_url,
                  impersonate='chrome120',
                  proxies={'http': proxy, 'https': proxy},
                  timeout=30,
              )

          def cxs_post(host, tenant, slug, keyword, offset, cookies, proxy=PROXY):
              """Step 2: POST CXS with cookies and search params, return Response."""
              cxs_url = f'https://{host}/wday/cxs/{tenant}/{slug}/jobs'
              origin  = f'https://{host}'
              referer = f'{origin}/en-US/{slug}'
              body = json.dumps({
                  'appliedFacets': {},
                  'searchText':    keyword,
                  'limit':         20,
                  'offset':        offset,
              })
              return cf_requests.post(
                  cxs_url,
                  impersonate='chrome120',
                  proxies={'http': proxy, 'https': proxy},
                  cookies=cookies,
                  data=body,
                  headers={
                      'Content-Type':    'application/json',
                      'Accept':          'application/json',
                      'Accept-Language': 'en-US',
                      'Origin':          origin,
                      'Referer':         referer,
                  },
                  timeout=30,
              )

          def post_ingest(jobs, source):
              """Ship parsed jobs to Worker /ingest."""
              if not jobs: return None
              payload = json.dumps({'source': source, 'jobs': jobs}).encode()
              req = urllib.request.Request(
                  WORKER_URL + '/ingest', data=payload, method='POST',
                  headers={
                      'Content-Type':   'application/json',
                      'X-STAT-Ingest':  INGEST_TOKEN,
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return {'http': r.status, 'body': r.read(800).decode()}
              except urllib.error.HTTPError as e:
                  return {'http': e.code, 'body': e.read(500).decode()}
              except Exception as e:
                  return {'http': 'ERR', 'body': str(e)}

          # ── Runtime guard: validate session-cookie on FIRST company before
          #    sweeping the rest. If it fails, log and exit cleanly.
          validation_passed = False
          poll_rows = []
          ingest_total_jobs = 0
          ingest_total_matches = 0

          for idx, c in enumerate(companies, start=OFFSET):
              name    = c['name']
              tenant  = c['tenant']
              cluster = c['cluster']
              slug    = c['slug']
              host    = f'{tenant}.{cluster}.myworkdayjobs.com'
              print(f'\n=== [{idx}] {name} ({tenant}.{cluster}, slug={slug}) ===')

              row = {
                  'idx': idx, 'name': name, 'tenant': tenant, 'cluster': cluster, 'slug': slug,
                  'get_status': '-', 'get_bytes': 0,
                  'session_validated': False,
                  'unique_jobs': 0, 'keywords_completed': 0,
                  'ingest_http': '-', 'ingest_body': '',
                  'maintenance': False, 'skipped_reason': None,
              }

              # ── Step 1: seed session cookies ────────────────────────
              try:
                  g = seed_session(host, slug)
                  row['get_status'] = str(g.status_code)
                  row['get_bytes']  = len(g.content)
                  print(f'  GET listing: status={g.status_code} bytes={len(g.content)}')
                  if g.status_code == 500 and b'maintenance-page' in g.content:
                      print('  → maintenance signature; skipping tenant')
                      row['maintenance'] = True
                      row['skipped_reason'] = 'maintenance'
                      poll_rows.append(row)
                      continue
                  if g.status_code != 200 or len(g.content) < 1000:
                      print(f'  → unexpected GET response; skipping tenant')
                      row['skipped_reason'] = f'GET status={g.status_code} bytes={len(g.content)}'
                      poll_rows.append(row)
                      continue
                  cookies = g.cookies
              except Exception as e:
                  print(f'  GET ERROR: {e!r}')
                  row['get_status'] = 'ERR'
                  row['skipped_reason'] = f'GET exception: {e!r}'
                  poll_rows.append(row)
                  continue

              # ── Step 2: validation probe (first company only) ──────
              if not validation_passed:
                  try:
                      v = cxs_post(host, tenant, slug, KEYWORDS[0], 0, cookies)
                      vbytes = len(v.content)
                      vstat  = v.status_code
                      print(f'  validation POST: status={vstat} bytes={vbytes}')
                      if vstat == 200:
                          try:
                              vd = json.loads(v.content)
                              if isinstance(vd.get('jobPostings'), list):
                                  validation_passed = True
                                  row['session_validated'] = True
                                  print(f'  → session-cookie validated ({len(vd["jobPostings"])} jobs in probe)')
                          except Exception:
                              pass
                  except Exception as e:
                      print(f'  validation ERROR: {e!r}')

                  if not validation_passed:
                      print('::error::Session-cookie approach failed validation against first company.')
                      print('Refusing to sweep remaining tenants. Per S26 spec — log + exit.')
                      row['skipped_reason'] = 'session-cookie validation failed'
                      poll_rows.append(row)
                      # Don't break — write the log and stop with non-success.
                      json.dump(poll_rows, open(POLL_LOG, 'w'), indent=2)
                      sys.exit(0)  # exit 0 — workflow itself succeeded, just no ingest

              # ── Step 3: multi-keyword × paginated CXS sweep ─────────
              unique_by_req = {}  # req_id → job dict
              for kw in KEYWORDS:
                  print(f'  --- keyword: {kw} ---')
                  pages_done = 0
                  for page in range(MAX_PAGES):
                      off = page * 20
                      try:
                          r = cxs_post(host, tenant, slug, kw, off, cookies)
                      except Exception as e:
                          print(f'    page off={off}: POST ERROR {e!r}')
                          break
                      if r.status_code != 200:
                          print(f'    page off={off}: status={r.status_code} bytes={len(r.content)} — stopping keyword')
                          break
                      try:
                          d = json.loads(r.content)
                      except Exception:
                          print(f'    page off={off}: non-JSON response — stopping keyword')
                          break
                      postings = d.get('jobPostings') or []
                      total    = d.get('total')
                      new_here = 0
                      for p in postings:
                          ep = p.get('externalPath') or ''
                          # req_id = trailing token after last underscore
                          import re
                          m = re.search(r'_([A-Za-z0-9-]+)$', ep)
                          req_id = m.group(1) if m else (p.get('bulletFields') or [None])[0] or ep or p.get('title') or ''
                          req_id = str(req_id)
                          if not req_id or req_id in unique_by_req:
                              continue
                          loc = p.get('locationsText') or ''
                          env_tag = 'remote' if 'remote' in loc.lower() else ('hybrid' if 'hybrid' in loc.lower() else '')
                          job_url = (f'https://{host}/en-US' + ep) if ep else f'https://{host}'
                          unique_by_req[req_id] = {
                              'id':          req_id,
                              'title':       p.get('title') or '',
                              'company':     name,
                              'location':    loc,
                              'environment': env_tag,
                              'url':         job_url,
                              'postedAt':    p.get('postedOn'),
                              'atsSource':   'workday',
                              'description': '',
                          }
                          new_here += 1
                      pages_done = page + 1
                      print(f'    page off={off}: postings={len(postings)} new={new_here} total_reported={total}')
                      # Stop conditions: less-than-full page or hit reported total
                      if len(postings) < 20: break
                      if isinstance(total, int) and len(unique_by_req) >= total: break
                      time.sleep(1)  # polite per-page
                  row['keywords_completed'] += 1
                  time.sleep(1)  # polite per-keyword

              row['unique_jobs'] = len(unique_by_req)
              print(f'  TOTAL unique: {len(unique_by_req)} across {row["keywords_completed"]} keywords')

              # ── Step 4: ingest ──────────────────────────────────────
              if unique_by_req:
                  src = f'wd5-cron:{tenant}.{cluster}'
                  ir = post_ingest(list(unique_by_req.values()), src)
                  if ir:
                      row['ingest_http'] = ir['http']
                      row['ingest_body'] = ir['body']
                      print(f'  ingest: http={ir["http"]} body={ir["body"][:200]}')
                      try:
                          ib = json.loads(ir['body'])
                          ingest_total_matches += int(ib.get('newMatches', 0))
                      except Exception:
                          pass
                  ingest_total_jobs += len(unique_by_req)

              poll_rows.append(row)
              time.sleep(2)  # polite per-tenant

          json.dump(poll_rows, open(POLL_LOG, 'w'), indent=2)

          print('\n=== SUMMARY ===')
          print(f'Companies polled: {len(poll_rows)}')
          print(f'Total unique jobs ingested: {ingest_total_jobs}')
          print(f'Total new matches: {ingest_total_matches}')
          for r in poll_rows:
              marker = '✅' if r['unique_jobs'] > 0 else ('🛠' if r['maintenance'] else '❌')
              print(f'  {marker} [{r["idx"]}] {r["name"]}: jobs={r["unique_jobs"]} '
                    f'kws_done={r["keywords_completed"]} ingest={r["ingest_http"]}')
          PYEOF

      - name: Commit poll results
        run: |
          git config user.email "ci@stat"
          git config user.name "STAT CI"
          git pull --rebase origin main || true
          git add outbox/wd5-poll-*.json 2>/dev/null || true
          git commit -m "ci: S26 wd5 session-cookie CXS poll results [skip ci]" || echo "no changes"
          git push origin main || echo "push skipped"
