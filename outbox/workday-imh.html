    <meta name="description" property="og:description" content="Headquartered in Utah with locations in six primary states and additional operations across the western U.S., Intermountain Health is a nonprofit system of 34 hospitals, 400+ clinics, a medical group of more than 4,800 employed physicians and advanced care providers, a health plan division called Select Health with more than one million members, and other health services. Helping people live the healthiest lives possible, Intermountain is widely recognized as a leader in clinical quality improvement and efficient healthcare delivery. Join our world-class team and embark on a career filled with opportunities, strength, innovation, and fulfillment. To find out more about us, head to our career site here. Sign up for job alerts! Click ‘sign in’ at the top right corner, create a candidate account, and when we have opportunities that meet your interests, you will receive an email with the job details. Intermountain Health strives to make the application process accessible to all users. If you would like to contact us regarding the accessibility of our website or need assistance completing the application process, please contact 1-800-843-7820 or email recruitment@imail.org. This contact information is for accommodation requests only and cannot be used to inquire about the status of applications. Introduce yourself to our Talent Acquisition team and we will get in touch if there is a role that seems like a good match. Intermountain Health’s PEAK program supports caregivers in the pursuit of their education goals and career aspirations by providing up-front tuition coverage paid directly to the academic institution. The program offers 100+ learning options to choose from, including undergraduate studies, high school diplomas, and professional skills and certificates. Caregivers are eligible to participate in PEAK on day 1 of employment. Learn more. The primary intent of this job description is to set a fair and equitable rate of pay for this classification. Only those key duties necessary for proper job evaluation and/or labor market analysis have been included. Other duties may be assigned by the supervisor. All positions subject to close without notice. Thanks for your interest in continuing your career with our team!">
